  <!-- comet -->
  <g class="comet">
    <line x1="0" y1="0" x2="-46" y2="-24" stroke="#E6F0EE" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <circle cx="0" cy="0" r="2.6" fill="#FFFFFF"/>
  </g>

  <!-- planet system -->
  <g class="pg"><circle cx="985" cy="178" r="150" fill="url(#pglow)"/></g>
  <!-- back half of orbit ring -->
  <g transform="rotate(-22 985 178)">
    <path d="M 847 178 A 138 52 0 0 0 1123 178" fill="none" stroke="url(#ring)" stroke-width="2.2" opacity="0.55"/>
  </g>
  <circle cx="985" cy="178" r="86" fill="url(#planet)" filter="url(#glow)"/>
  <ellipse cx="959" cy="148" rx="34" ry="22" fill="#FFFFFF" opacity="0.16" filter="url(#soft)"/>
  <!-- front half of orbit ring + orbiting moon -->
  <g transform="rotate(-22 985 178)">
    <path d="M 847 178 A 138 52 0 0 1 1123 178" fill="none" stroke="url(#ring)" stroke-width="2.6"/>
    <g>
      <circle class="moonHi" cx="1123" cy="178" r="5" fill="#E6F0EE"/>
      <animateTransform attributeName="transform" type="rotate" from="0 985 178" to="360 985 178" dur="14s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- text block -->
  <g transform="translate(96 132)">
    <text class="sub" x="2" y="-34" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="15" letter-spacing="7" fill="#34F5B0" opacity="0.95">F I R S T &#160; F I N A N C E &#160; C O M P A N Y</text>
    <text class="ttl" x="0" y="22" font-family="Georgia,'Times New Roman',serif" font-size="62" font-weight="700" letter-spacing="1.5" fill="url(#title)">Dhulfiqar Ali</text>
    <rect class="ul" x="2" y="38" width="430" height="3" rx="1.5" fill="url(#ul)"/>
    <text class="sub" x="2" y="78" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="21" letter-spacing="2" fill="#E6F0EE">Backend-focused Software Engineer</text>
    <text class="chip" x="2" y="112" font-family="'Courier New',monospace" font-size="14.5" letter-spacing="1.5" fill="#8FA8A0">// APIs &#183; system design &#183; production fintech &#183; AI</text>
