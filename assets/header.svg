<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Dhulfiqar Ali — Backend-focused Software Engineer">
  <defs>
    <radialGradient id="bg" cx="78%" cy="38%" r="95%">
      <stop offset="0%" stop-color="#0E1B33"/>
      <stop offset="48%" stop-color="#0A1124"/>
      <stop offset="100%" stop-color="#05070F"/>
    </radialGradient>
    <radialGradient id="nebA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#34F5B0"/>
      <stop offset="42%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#0E6B4E"/>
    </radialGradient>
    <radialGradient id="pglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34F5B0" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#1D9E75" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#34F5B0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#34F5B0"/>
      <stop offset="80%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .star { animation-name: tw; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
      @keyframes tw { 0%,100% { opacity:.2 } 50% { opacity:1 } }
      .neb { animation: drift 16s ease-in-out infinite alternate; transform-origin:center; }
      .nebB { animation: drift 22s ease-in-out infinite alternate-reverse; }
      @keyframes drift { from { transform: translate(0,0) scale(1) } to { transform: translate(22px,-14px) scale(1.08) } }
      .pg { animation: pulse 6s ease-in-out infinite; transform-origin:985px 178px; }
      @keyframes pulse { 0%,100% { opacity:.75; transform:scale(1) } 50% { opacity:1; transform:scale(1.06) } }
      .comet { animation: shoot 9s linear infinite; opacity:0; }
      @keyframes shoot { 0% { transform:translate(0,0); opacity:0 } 4% { opacity:1 } 14% { opacity:0 } 100% { transform:translate(560px,300px); opacity:0 } }
      .ul { transform: scaleX(0); transform-origin:left center; animation: grow 1.6s cubic-bezier(.2,.8,.2,1) .4s forwards; }
      @keyframes grow { to { transform: scaleX(1) } }
      .ttl { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .sub { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) .18s both; }
      .chip { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) .34s both; }
      @keyframes rise { from { opacity:0; transform:translateY(14px) } to { opacity:1; transform:translateY(0) } }
      .moonHi { animation: tw 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- nebulae -->
  <ellipse class="neb"  cx="320" cy="120" rx="280" ry="150" fill="url(#nebA)" filter="url(#soft)"/>
  <ellipse class="nebB" cx="760" cy="300" rx="320" ry="160" fill="url(#nebB)" filter="url(#soft)"/>

