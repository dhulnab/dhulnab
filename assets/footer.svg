    </linearGradient>
    <radialGradient id="horizon" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#1D9E75" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#1D9E75" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#1D9E75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D9E75"/>
      <stop offset="100%" stop-color="#0E6B4E"/>
    </linearGradient>
    <linearGradient id="ftxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34F5B0"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="fsoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <!-- edge-fade: dissolves the banner into the page on every side -->
    <linearGradient id="ffadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#000" stop-opacity="1"/>
      <stop offset="0.06" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.94" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="ffadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#000" stop-opacity="1"/>
      <stop offset="0.32" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="fedgeFade" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="230">
      <rect width="1200" height="230" fill="#fff"/>
      <rect width="1200" height="230" fill="url(#ffadeY)"/>
    </mask>
    <style>
      .star { animation: tw 4s ease-in-out infinite; }
      @keyframes tw { 0%,100% { opacity:.2 } 50% { opacity:1 } }
      .halo { animation: breathe 7s ease-in-out infinite; transform-origin:center bottom; }
      @keyframes breathe { 0%,100% { opacity:.7; transform:scaleY(1) } 50% { opacity:1; transform:scaleY(1.12) } }
      .ftxt { animation: fade 1.4s ease both; }
      @keyframes fade { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:translateY(0) } }
    </style>
  </defs>
